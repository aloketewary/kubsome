replicaCount: 1

image:
  repository: ghcr.io/aloketewary/kubsome
  tag: "1.13.33"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kubsome.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: kubsome

rbac:
  create: true
  # Keep the default deployment read-only. Enable explicitly only when
  # mutation routes and pod shell access are required.
  allowMutations: false
  rules:
    - apiGroups: ["", "apps", "batch", "networking.k8s.io", "autoscaling", "policy"]
      resources: ["*"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["pods/log"]
      verbs: ["get"]
  mutationRules:
    - apiGroups: ["apps"]
      resources: ["deployments"]
      verbs: ["patch"]
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["delete"]
    - apiGroups: [""]
      resources: ["pods/exec"]
      verbs: ["create"]

nodeSelector: {}
tolerations: []
affinity: {}
